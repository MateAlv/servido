server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's DNS, looked up on every request: the api container gets a new address when a
    # deploy recreates it.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in every file name under /assets, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Any other path is a route of the single-page app: React Router reads it from index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
