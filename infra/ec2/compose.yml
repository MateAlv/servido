# Production: the same three services as `make up`, built for production, on the app
# instance. CloudFront is the only client (see network.tf) and reaches nginx on port 80.
# deploy.sh writes .env (database password and JWT secret) from SSM Parameter Store.
name: servido

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: servido
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy.sh, it writes .env}
      POSTGRES_DB: servido
    volumes:
      # /var/lib/servido is the EBS volume that backups.tf snapshots every night.
      - ${DATA_DIR:-/var/lib/servido}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servido -d servido"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  api:
    build: ../../backend
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    environment:
      DATABASE_URL: postgresql+psycopg://servido:${POSTGRES_PASSWORD}@db:5432/servido
      JWT_SECRET: ${JWT_SECRET:?run deploy.sh, it writes .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  web:
    build: ../../frontend
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging
