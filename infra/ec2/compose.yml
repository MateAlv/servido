# Production stack on the API instance. CloudFront is the only client (see network.tf),
# so uvicorn trusts its forwarded headers. deploy.sh writes .env from SSM Parameter Store.
services:
  api:
    build: ../../backend
    env_file: .env
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    ports:
      - "${API_PORT:-80}:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
