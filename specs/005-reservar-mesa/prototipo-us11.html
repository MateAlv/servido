<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servido! — Reservar mesa (US-11)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#d2441c;--primary-dark:#8f2d10;--on-primary:#fff;
  --text:#3b1f18;--muted:#6b4a40;--bg:#fdf9ee;--surface:#fff;--sunken:#f4ecdc;--line:#eadfca;
  --ok:#1f7a3d;--ok-bg:#dcf2e2;--warn:#8a5a00;--warn-bg:#fff0c9;--error:#b3261e;
  --display:'Baloo 2',Nunito,system-ui,sans-serif;--body:Nunito,system-ui,sans-serif;
  --r-card:26px;--r-field:14px;--r-pill:999px;--shadow:0 14px 40px #3b1f1818;
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --text:#fbeee0;--muted:#cdb5a6;--bg:#1d110d;--surface:#2a1914;--sunken:#24150f;--line:#4a3027;
  --ok:#7fd69a;--ok-bg:#17381f;--warn:#f1c35a;--warn-bg:#40300a;--error:#ff9b92;--shadow:0 14px 40px #00000040;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:700 17px/1.45 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.container{max-width:1080px;margin:0 auto;padding:22px 24px 60px}
.back{display:inline-flex;gap:6px;margin-bottom:18px;color:var(--text);font-weight:800;text-decoration:none}
.back:hover{color:var(--primary)}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
.eyebrow{margin:0;color:var(--primary);font-size:15px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
h1{margin:6px 0 4px;font:800 clamp(32px,5vw,48px)/1.05 var(--display)}
.muted{margin:0;color:var(--muted);font-weight:600}
.pill{display:inline-flex;gap:6px;padding:3px 10px;border-radius:var(--r-pill);font-size:13px;font-weight:800;white-space:nowrap;background:var(--warn-bg);color:var(--warn)}
.layout{display:grid;grid-template-columns:minmax(0,720px);gap:28px}
.steps{display:grid;gap:18px;min-width:0}
.card{border:2px solid var(--line);border-radius:var(--r-card);background:var(--surface);padding:24px;display:grid;gap:16px}
h2{display:flex;align-items:center;gap:10px;margin:0;font:800 24px/1.15 var(--display)}
.num{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--on-primary);font:800 17px var(--display)}
.fields{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 24px;align-items:start}
label,.flabel{font-size:15px;font-weight:800;display:block;margin-bottom:6px}
input[type=date]{width:100%;min-height:48px;padding:11px 14px;border:2px solid var(--line);border-radius:var(--r-field);background:var(--bg);color:var(--text);font:700 16px var(--body)}
input[type=date]:hover{border-color:var(--muted)}
.err{margin:6px 0 0;color:var(--error);font-weight:800;font-size:15px}
.hint{margin:6px 0 0;color:var(--muted);font-size:13px;font-weight:700}
.stepper{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:var(--r-pill);padding:4px;background:var(--surface)}
.stepper button{width:40px;height:40px;border:0;border-radius:50%;background:transparent;font-size:22px;font-weight:800}
.stepper button:hover:not(:disabled){background:var(--sunken)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper output{min-width:34px;text-align:center;font:800 20px var(--display)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 18px;border:2px solid var(--line);border-radius:var(--r-pill);background:var(--surface);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;transition:.24s var(--ease)}
.chip:hover{border-color:var(--text)}
.chip[aria-pressed=true]{border-color:var(--text);background:var(--text);color:var(--bg);animation:pop .32s var(--spring)}
.chip:disabled,.chip:disabled:hover{border-style:dashed;border-color:var(--line);background:var(--sunken);color:var(--muted);cursor:not-allowed}
.chip small{font-size:13px;letter-spacing:.03em;text-transform:uppercase}
@keyframes pop{0%{transform:scale(.9)}100%{transform:none}}
.notice{margin:0;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r-field);background:var(--sunken);font-weight:700}
.tables{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.table{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border:2px solid var(--line);border-radius:22px;background:var(--surface);transition:.24s var(--ease)}
.table.sel{border-color:var(--primary);box-shadow:var(--shadow)}
.tlabel{font:800 19px/1.2 var(--display);display:block}
.btn{min-height:40px;padding:0 18px;border:2px solid var(--text);border-radius:var(--r-pill);background:transparent;font-weight:800}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);box-shadow:0 4px 0 var(--primary-dark)}
.skel{height:40px;width:92px;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--line),var(--sunken),var(--line));background-size:200% 100%;animation:sh 1.2s linear infinite}
.skel.t{height:68px;width:100%;border-radius:18px}
@keyframes sh{to{background-position:-200% 0}}
dl{display:grid;gap:10px;margin:0}
.row{display:grid;gap:2px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.row:last-child{border:0;padding:0}
dt{color:var(--muted);font-size:13px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
dd{margin:0;font-weight:800}
dd.empty{color:var(--muted);font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 18px;border-radius:var(--r-field);background:var(--text);color:var(--bg);font-weight:800;box-shadow:var(--shadow);z-index:9}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.stale{opacity:.55}

.notice.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.actions{display:flex;justify-content:flex-end}
.btn.primary{min-height:48px;padding:0 28px}
.btn.primary{min-height:48px;padding:0 28px}
@media(max-width:560px){.container{padding:16px 16px 40px}.header{flex-direction:column}.fields{grid-template-columns:1fr}.table{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<main class="container" id="app"></main>
<div id="toast-root" role="status" aria-live="polite"></div>

<script>
/* ---------- Mock del contrato de disponibilidad (spec 005) ---------- */
const RESTAURANT = { name: 'La Esquina de Palermo', sub: 'Parrilla · Palermo' };
const TZ = 'America/Argentina/Buenos_Aires';
const AREAS = [['indoor','Adentro'],['outdoor','Afuera'],['terrace','Terraza']];
const AREA_LABEL = Object.fromEntries(AREAS);
const TABLES = [
  {id:'mesa-1',label:'Mesa 1',capacity:2,area:'indoor',active:true},
  {id:'mesa-2',label:'Mesa 2',capacity:2,area:'indoor',active:true},
  {id:'mesa-3',label:'Mesa 3',capacity:4,area:'outdoor',active:true},
  {id:'mesa-4',label:'Mesa 4',capacity:4,area:'terrace',active:true},
  {id:'mesa-5',label:'Mesa 5',capacity:2,area:'indoor',active:false}, // inactiva: nunca se ofrece
];
const SHIFTS = [[12*60,15*60],[20*60,23*60+30]];
const BLOCK = 90, STEP = 30;
const FULL = new Set(['20:30']);              // sin mesas libres -> «Ocupado» (S4)
const TAKEN = {'21:00':['mesa-4']};            // 4 personas + Terraza a las 21:00 -> sin mesas (S7)
const ACTIVE = TABLES.filter(t => t.active);
const MAX_PARTY = Math.max(0, ...ACTIVE.map(t => t.capacity));

const fmtParts = new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function nowBA(){const p=Object.fromEntries(fmtParts.formatToParts(new Date()).map(x=>[x.type,x.value]));return{date:`${p.year}-${p.month}-${p.day}`,min:+p.hour*60+ +p.minute}}
const hhmm = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const isOpenDay = d => new Date(d+'T00:00:00Z').getUTCDay() !== 1; // lunes cerrado
function isIso(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const d=new Date(v+'T00:00:00Z');return !isNaN(d)&&d.toISOString().startsWith(v)}
const wait = () => new Promise(r => setTimeout(r, 220));

function freeTables(time, party){
  if (FULL.has(time) || party > MAX_PARTY) return [];
  const taken = TAKEN[time] || [];
  return ACTIVE.filter(t => t.capacity >= party && !taken.includes(t.id))
    .sort((a,b)=> AREAS.findIndex(x=>x[0]===a.area)-AREAS.findIndex(x=>x[0]===b.area) || a.capacity-b.capacity || a.label.localeCompare(b.label,'es'));
}
async function fetchAvailability(date, party){
  await wait();
  const {date:today,min:now} = nowBA();
  const open = date >= today && isOpenDay(date);
  let slots = [];
  if (open && party <= MAX_PARTY){
    for (const [s,e] of SHIFTS) for (let t=s; t+BLOCK<=e; t+=STEP)
      if (date > today || t > now) slots.push({start_time:hhmm(t), available: freeTables(hhmm(t),party).length>0});
  }
  return {date, open, duration_minutes:BLOCK, max_party_size:MAX_PARTY, slots};
}
async function fetchTables(date, time, party){
  await wait();
  return {tables: freeTables(time, party)};
}

/* ---------- Estado (vive en la URL cuando el navegador lo permite) ---------- */
let sel = {fecha:'',hora:'',personas:1,tipo:null};
let slotsData = null, slotsLoading = false, slotsStale = false, slotsError = false;
let tablesData = null, tablesLoading = false;
let pastDateError = '';
let reqId = 0;

function normalize(s){
  const today = nowBA().date;
  const fecha = isIso(s.fecha) && s.fecha >= today ? s.fecha : '';
  const hora = fecha && /^([01]\d|2[0-3]):[0-5]\d$/.test(s.hora) ? s.hora : '';
  const personas = fecha && Number.isInteger(+s.personas) && +s.personas >= 1 ? +s.personas : 1;
  const tipo = AREAS.some(a=>a[0]===s.tipo) ? s.tipo : null;
  return {fecha,hora,personas,tipo};
}
function readUrl(){
  try{const p=new URLSearchParams(location.search);
    sel = normalize({fecha:p.get('fecha')||'',hora:p.get('hora')||'',personas:p.get('personas')||'1',tipo:p.get('tipo')});
  }catch{}
}
function writeUrl(){
  try{const p=new URLSearchParams();
    if(sel.fecha)p.set('fecha',sel.fecha);if(sel.hora)p.set('hora',sel.hora);
    if(sel.personas>1)p.set('personas',sel.personas);if(sel.tipo)p.set('tipo',sel.tipo);
    history.replaceState(null,'',p.toString()?'?'+p:location.pathname);
  }catch{}
}
function toast(msg){
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.getElementById('toast-root').appendChild(el);setTimeout(()=>el.remove(),3200);
}
function set(patch, refetch = true){
  const prev = sel;
  sel = normalize({...sel,...patch});
  writeUrl();
  const needSlots = sel.fecha && (sel.fecha!==prev.fecha || sel.personas!==prev.personas);
  const needTables = sel.fecha && sel.hora && (needSlots || sel.hora!==prev.hora);
  if (!sel.fecha){slotsData=null;tablesData=null}
  if (!sel.hora) tablesData=null;
  render();
  if (refetch) load(needSlots, needTables);
}

/* ---------- Carga y reglas de disponibilidad ---------- */
async function load(needSlots, needTables){
  const id = ++reqId;
  if (needSlots){
    slotsLoading = true; slotsStale = !!slotsData; slotsError = false; render();
    const res = await fetchAvailability(sel.fecha, sel.personas);
    if (id !== reqId) return;
    slotsData = res; slotsLoading = false; slotsStale = false;
    // FR-013: nunca más que el máximo del restaurante
    if (res.max_party_size > 0 && sel.personas > res.max_party_size){
      toast(`La capacidad máxima de este restaurante es de ${res.max_party_size} personas.`);
      sel.personas = res.max_party_size; writeUrl(); render();
      return load(true, !!sel.hora);
    }
    // S4: un horario que ya no está libre no puede quedar elegido
    if (sel.hora){
      const s = res.slots.find(x=>x.start_time===sel.hora);
      if (!s || !s.available){
        toast(`El horario de las ${sel.hora} ya no está disponible. Elegí otro.`);
        sel.hora=''; tablesData=null; writeUrl(); needTables=false;
      }
    }
    render();
  }
  if (needTables && sel.fecha && sel.hora && slotsData && slotsData.max_party_size>0){
    tablesLoading = true; render();
    const res = await fetchTables(sel.fecha, sel.hora, sel.personas);
    if (id !== reqId) return;
    tablesData = res; tablesLoading = false;
    if (sel.tipo && !res.tables.some(t=>t.area===sel.tipo)){
      toast(`No quedan mesas en ${AREA_LABEL[sel.tipo].toLowerCase()} para ese horario. Volvimos a «Sin preferencia».`);
      sel.tipo=null; writeUrl();
    }
    render();
  }
}

/* ---------- Acciones ---------- */
function changeDate(v){
  if (v && v < nowBA().date){pastDateError='No podés reservar en una fecha pasada.';render();return}
  pastDateError=''; set({fecha:v});
}

function changeArea(a){ set({tipo:a}, false); }

/* ---------- Render ---------- */
// true when the chosen date, time and party have no free table in that area
const areaFull = a => !!(sel.hora && tablesData && !tablesLoading && !tablesData.tables.some(t=>t.area===a));
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DATE_FMT = new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'numeric',month:'long'});

function slotsHtml(){
  if (!sel.fecha) return '<p class="muted">Elegí una fecha para ver los horarios.</p>';
  if (slotsError) return '<p class="notice" role="alert">No pudimos cargar los horarios.</p>';
  if (!slotsData) return '<div class="chips" aria-busy="true"><span class="vh" role="status">Cargando horarios…</span>'+'<span class="skel"></span>'.repeat(6)+'</div>';
  const d = slotsData;
  if (d.max_party_size===0 || sel.personas>d.max_party_size) return '';
  if (!d.open) return '<p class="notice">Ese día el restaurante no atiende.</p>';
  if (!d.slots.length) return '<p class="notice">Ya no quedan horarios para este día.</p>';
  const allBusy = d.slots.every(s=>!s.available);
  return `<div style="display:grid;gap:12px" aria-busy="${slotsStale}">
    <div class="chips ${slotsStale?'stale':''}" role="group" aria-label="Horarios disponibles">
    ${d.slots.map(s=>`<button class="chip" data-slot="${s.start_time}" aria-pressed="${sel.hora===s.start_time}" ${s.available?'':'disabled'}>${s.start_time}${s.available?'':' <small>Ocupado</small>'}</button>`).join('')}
    </div>${allBusy?'<p class="notice">No quedan horarios con mesa libre para este día. Probá con otra fecha o con menos personas.</p>':''}</div>`;
}
function tablesHtml(){
  if (slotsData && (slotsData.max_party_size===0 || sel.personas>slotsData.max_party_size)) return '';
  if (!sel.hora) return '<p class="muted">Elegí un horario para ver las mesas.</p>';
  if (tablesLoading || !tablesData) return '<div class="tables" aria-busy="true"><span class="vh" role="status">Cargando mesas…</span><span class="skel t"></span><span class="skel t"></span></div>';
  const all = tablesData.tables;
  const list = all.filter(t=>!sel.tipo || t.area===sel.tipo);
  if (!list.length) return `<p class="notice" role="status">No hay mesas disponibles para esta fecha y horario${all.length?' con esa preferencia':''}. Podés cambiar la fecha, el horario o la preferencia.</p>`;
  return `<p class="notice ok" role="status">Hay mesa disponible${sel.tipo?' en '+AREA_LABEL[sel.tipo].toLowerCase():''} para ese día y horario. Te asignamos una automáticamente.</p>`;
}

function render(){
  const focusId = document.activeElement && document.activeElement.id;
  const today = nowBA().date;
  const max = slotsData ? slotsData.max_party_size : null;
  const noTables = max===0;
  const stepperMax = !sel.fecha ? 1 : (max || sel.personas);
  const shownParty = sel.fecha ? sel.personas : 1;
  document.getElementById('app').innerHTML = `
  <a class="back" href="#" onclick="return false">← Volver al restaurante</a>
  <header class="header"><div><p class="eyebrow">Reservar mesa</p><h1>${RESTAURANT.name}</h1><p class="muted">${RESTAURANT.sub}</p></div>
    <span class="pill">▲ Datos de prueba</span></header>
  <div class="layout"><div class="steps">
    <section class="card"><h2><span class="num" aria-hidden="true">1</span>¿Cuándo y cuántos?</h2>
      <div class="fields">
        <div><label for="fecha">Fecha</label><input id="fecha" type="date" min="${today}" value="${sel.fecha}" ${pastDateError?'aria-invalid="true"':''}>
          ${pastDateError?`<p class="err" role="alert">${pastDateError}</p>`:''}</div>
        ${noTables?'<p class="notice" role="status">El restaurante todavía no tiene mesas disponibles.</p>':`
        <div><span class="flabel">Personas</span>
          <div class="stepper" role="group" aria-label="Cantidad de personas">
            <button id="minus" aria-label="Quitar uno" ${shownParty<=1?'disabled':''}>−</button>
            <output aria-live="polite">${shownParty}</output>
            <button id="plus" aria-label="Agregar uno" ${shownParty>=stepperMax?'disabled':''}>+</button></div>
          <p class="hint">${max?`Máximo ${max} personas`:'Elegí una fecha para ver el máximo.'}</p></div>`}
      </div></section>
    <section class="card"><h2><span class="num" aria-hidden="true">2</span>Horario</h2>${slotsHtml()}</section>
    <section class="card"><h2><span class="num" aria-hidden="true">3</span>¿Dónde querés sentarte?</h2>
      <div class="chips" role="group" aria-label="Preferencia de tipo de mesa">
        <button class="chip" data-area="" aria-pressed="${sel.tipo===null}">Sin preferencia</button>
        ${AREAS.map(([v,l])=>{const none=areaFull(v);return `<button class="chip" data-area="${v}" aria-pressed="${sel.tipo===v}" ${none?'disabled':''}>${l}${none?' <small>Sin mesas</small>':''}</button>`}).join('')}
      </div>${tablesHtml()}</section>
    <div class="actions"><button class="btn primary" type="button">Siguiente →</button></div>
  </div>
</div>`;
  document.getElementById('fecha').addEventListener('change', e => changeDate(e.target.value));
  const m = document.getElementById('minus'), p = document.getElementById('plus');
  if (m) m.onclick = () => set({personas: sel.personas-1});
  if (p) p.onclick = () => set({personas: sel.personas+1});
  document.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => set({hora:b.dataset.slot}));
  document.querySelectorAll('[data-area]').forEach(b => b.onclick = () => changeArea(b.dataset.area||null));
  if (focusId){const el=document.getElementById(focusId);if(el)el.focus()}
}

readUrl();
render();
if (sel.fecha) load(true, !!sel.hora);
</script>
</body>
</html>
