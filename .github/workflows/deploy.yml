name: Deploy

# Deploys main to AWS (see infra/README.md): the instance pulls the commit and rebuilds its
# containers. Skipped until the repository variables that `terraform output github_variables`
# prints are set. GitHub Actions is free for public repos.
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - infra/ec2/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy on the instance (migrations run when the API starts)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters "commands=[\"/opt/servido/infra/ec2/deploy.sh $GITHUB_SHA\"]" \
            --query Command.CommandId --output text)
          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Deploy status: $status"
          test "$status" = "Success"
