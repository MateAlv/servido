name: Deploy

# Deploys main to AWS (see infra/README.md). Skipped until the repository variables that
# `terraform output github_variables` prints are set. GitHub Actions is free for public repos.
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - infra/ec2/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update the API (migrations run on start)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters "commands=[\"/opt/servido/infra/ec2/deploy.sh $GITHUB_SHA\"]" \
            --query Command.CommandId --output text)
          for _ in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Deploy status: $status"
          test "$status" = "Success"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Publish the frontend
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws s3 sync frontend/dist "s3://$BUCKET" --delete \
            --exclude index.html --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" > /dev/null
