name: No AI attribution

# Team rule (AGENTS.md): commits and pull requests never credit an AI tool as author
# or co-author. AI use is disclosed only in the PR's "AI usage" section.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PATTERN: '^(co-authored-by|author):.*(claude|anthropic|openai|codex|copilot|gemini|cursor|gpt|antigravity)|generated (with|by) \[?(claude|codex|copilot|gemini|cursor|chatgpt)'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Commit messages
        run: |
          range="origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
          if git log --format='author: %an <%ae>%n%B' "$range" | grep -inE "$PATTERN"; then
            echo "::error::Remove AI attribution from these commit messages (see AGENTS.md)."
            exit 1
          fi

      - name: Pull request description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n' "$BODY" | grep -inE "$PATTERN"; then
            echo "::error::Remove AI attribution from the pull request description (see AGENTS.md)."
            exit 1
          fi
