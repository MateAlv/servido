name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: servido
          POSTGRES_PASSWORD: servido
          POSTGRES_DB: servido
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servido -d servido"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://servido:servido@localhost:5432/servido
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.21"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - name: Models and migrations are in sync
        run: uv run alembic check
      - run: uv run pytest
      - name: OpenAPI contract is up to date (run `make api-types`)
        run: |
          uv run python -c "import json; from app.main import app; print(json.dumps(app.openapi(), indent=2))" > ../frontend/src/api/openapi.json
          git diff --exit-code -- ../frontend/src/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: API types match the contract (run `make api-types`)
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: npx vitest run
      - run: npm run build
