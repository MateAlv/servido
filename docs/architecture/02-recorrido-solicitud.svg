" width="105.3" height="20" rx="10"/><text class="dg-e dg-e-acc" x="780.0" y="344" text-anchor="middle">SELECT … (TLS)</text><polyline class="dg-edge dg-edge-ret" points="874,380 686,380" marker-end="url(#seq-a)"/><rect class="dg-pill" x="756.0" y="358" width="47.9" height="20" rx="10"/><text class="dg-e" x="780.0" y="372" text-anchor="middle">filas</text><polyline class="dg-edge dg-edge-ret" points="674,408 306,408" marker-end="url(#seq-a)"/><rect class="dg-pill" x="469.2" y="386" width="41.5" height="20" rx="10"/><text class="dg-e" x="490.0" y="400" text-anchor="middle">JSON</text><polyline class="dg-edge dg-edge-ret" points="294,436 106,436" marker-end="url(#seq-a)"/><rect class="dg-pill" x="105.9" y="414" width="188.3" height="20" rx="10"/><text class="dg-e" x="200.0" y="428" text-anchor="middle">JSON → React dibuja el mapa</text></svg>
