<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1000 588" role="img" aria-label="Recorrido de una solicitud: CloudFront pide la página a nginx en la instancia y guarda los archivos de /assets en el borde; los pedidos a /api, como el ingreso, pasan sin cache por nginx a la API y esta consulta PostgreSQL." width="1000" height="588"><style>svg { --d-bg: #fdf9ee; --d-surface: #ffffff; --d-zone: #f6eedd; --d-ink: #3b1f18; --d-muted: #6b4a40; --d-line: #dccdb2; --d-accent: #c23d17; --d-deploy: #2563c9; } @media (prefers-color-scheme: dark) { svg { --d-bg: #1d110d; --d-surface: #2a1914; --d-zone: #24150f; --d-ink: #fbeee0; --d-muted: #cdb5a6; --d-line: #5a3b30; --d-accent: #ff8d66; --d-deploy: #8fb8ff; } }
