.dg-chip-t { font-weight: 800; font-size: 10px; letter-spacing: .05em; fill: var(--d-muted); }</style><rect class="dg-bg" width="1000" height="476"/><defs><marker id="seq-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="seq-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk dg-mk-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="seq-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk dg-mk-dep" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="dg-band" x="20" y="86" width="960" height="146" rx="14"/><text class="dg-z" x="36" y="108">1 · Abre la app</text><rect class="dg-band" x="20" y="246" width="960" height="212" rx="14"/><text class="dg-z" x="36" y="268">2 · Busca restaurantes</text><line class="dg-life" x1="100" y1="70" x2="100" y2="458"/><rect class="dg-node dg-node-acc" x="25" y="18" width="150" height="52" rx="14"/><text class="dg-t" x="100" y="40" text-anchor="middle">Navegador</text><text class="dg-s" x="100" y="58" text-anchor="middle">comensal</text><line class="dg-life" x1="300" y1="70" x2="300" y2="458"/><rect class="dg-node dg-node-acc" x="225" y="18" width="150" height="52" rx="14"/><text class="dg-t" x="300" y="40" text-anchor="middle">CloudFront</text><text class="dg-s" x="300" y="58" text-anchor="middle">borde, HTTPS</text><line class="dg-life" x1="480" y1="70" x2="480" y2="458"/><rect class="dg-node dg-node-acc" x="405" y="18" width="150" height="52" rx="14"/><text class="dg-t" x="480" y="40" text-anchor="middle">S3</text><text class="dg-s" x="480" y="58" text-anchor="middle">frontend</text><line class="dg-life" x1="680" y1="70" x2="680" y2="458"/><rect class="dg-node dg-node-acc" x="605" y="18" width="150" height="52" rx="14"/><text class="dg-t" x="680" y="40" text-anchor="middle">API</tex