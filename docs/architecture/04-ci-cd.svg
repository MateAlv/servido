<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1200 380" role="img" aria-label="Del código a producción: cada US va en una rama y un PR con CI y revisión; al mergear a main, GitHub Actions asume un rol temporal y por SSM le pide a la instancia que baje el commit y rearme sus contenedores." width="1200" height="380"><style>svg { --d-bg: #fdf9ee; --d-surface: #ffffff; --d-zone: #f6eedd; --d-ink: #3b1f18; --d-muted: #6b4a40; --d-line: #dccdb2; --d-accent: #c23d17; --d-deploy: #2563c9; } @media (prefers-color-scheme: dark) { svg { --d-bg: #1d110d; --d-surface: #2a1914; --d-zone: #24150f; --d-ink: #fbeee0; --d-muted: #cdb5a6; --d-line: #5a3b30; --d-accent: #ff8d66; --d-deploy: #8fb8ff; } }
.dg { font-family: Nunito, 'Segoe UI', system-ui, sans-serif; }
.dg-bg { fill: var(--d-bg); }
.dg-zone { fill: var(--d-zone); stroke: var(--d-line); stroke-width: 1.5; stroke-dasharray: 6 5; }
.dg-band { fill: var(--d-zone); }
.dg-node { fill: var(--d-surface); stroke: var(--d-line); stroke-width: 1.5; }
.dg-node-acc { stroke: var(--d-accent); stroke-width: 2; }
.dg-node-ext { fill: var(--d-bg); stroke: var(--d-muted); stroke-dasharray: 4 3; }
.dg-node-ent { stroke: var(--d-ink); stroke-width: 1.5; }
.dg-rule { stroke: var(--d-line); stroke-width: 1.5; }
.dg-t { font-weight: 800; font-size: 13.5px; fill: var(--d-ink); }
.dg-s { font-weight: 600; font-size: 11.5px; fill: var(--d-muted); }
.dg-m { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 11px; fill: var(--d-muted); }
.dg-mono-t { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; font-size: 12px; fill: var(--d-ink); }
.dg-z { font-weight: 800; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; fill: var(--d-muted); }
.dg-e { font-weight: 700; font-size: 11px; fill: var(--d-ink); }
.dg-e-acc { fill: var(--d-accent); }
.dg-e-dep { fill: var(--d-deploy); }
.dg-pill { fill: var(--d-bg); }
.dg-edge { fill: none; stroke: var(--d-muted); stroke-width: 1.6; }
.dg-edge-acc { stroke: var(--d-accent); stroke-width: 2; }
.dg-edge-dep { stroke: var(--d-deploy); stroke-width: 1.8; stroke-dasharray: 7 4; }
.dg-edge-ret { stroke-dasharray: 5 4; }
.dg-life { stroke: var(--d-line); stroke-width: 1.5; stroke-dasharray: 3 5; }
.dg-mk { fill: var(--d-muted); }
.dg-mk-acc { fill: var(--d-accent); }
.dg-mk-dep { fill: var(--d-deploy); }
.dg-chip { fill: var(--d-zone); }
.dg-chip-acc { fill: var(--d-bg); stroke: var(--d-accent); stroke-width: 1.2; }
.dg-chip-t { font-weight: 800; font-size: 10px; letter-spacing: .05em; fill: var(--d-muted); }</style><rect class="dg-bg" width="1200" height="380"/><defs><marker id="cic-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cic-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk dg-mk-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cic-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk dg-mk-dep" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="dg-zone" x="10" y="16" width="1180" height="150" rx="18"/><text class="dg-z" x="26" y="40">Cada cambio</text><rect class="dg-zone" x="10" y="186" width="1180" height="180" rx="18"/><text class="dg-z" x="26" y="210">Al mergear a main</text><rect class="dg-node" x="30" y="52" width="200" height="92" rx="14"/><text class="dg-t" x="44" y="77">Rama por US</text><text class="dg-m" x="44" y="95">002-us5-mapa</text><rect class="dg-node" x="262" y="52" width="200" height="92" rx="14"/><text class="dg-t" x="276" y="77">Pull request</text><text class="dg-s" x="276" y="95">plantilla + uso de IA</text><polyline class="dg-edge" points="232,98 260,98" marker-end="url(#cic-a)"/><rect class="dg-node dg-node-acc" x="494" y="52" width="200" height="92" rx="14"/><text class="dg-t" x="508" y="77">CI en GitHub</text><text class="dg-s" x="508" y="95">backend · frontend · infra</text><text class="dg-s" x="508" y="113">sin atribución a IA</text><polyline class="dg-edge" points="464,98 492,98" marker-end="url(#cic-a)"/><rect class="dg-node" x="726" y="52" width="200" height="92" rx="14"/><text class="dg-t" x="740" y="77">Revisión cruzada</text><text class="dg-s" x="740" y="95">otro integrante lo entiende</text><polyline class="dg-edge" points="696,98 724,98" marker-end="url(#cic-a)"/><rect class="dg-node" x="958" y="52" width="200" height="92" rx="14"/><text class="dg-t" x="972" y="77">Merge a main</text><text class="dg-s" x="972" y="95">historial atómico</text><polyline class="dg-edge" points="928,98 956,98" marker-end="url(#cic-a)"/><rect class="dg-node dg-node-acc" x="958" y="238" width="200" height="84" rx="14"/><text class="dg-t" x="972" y="263">Deploy</text><text class="dg-s" x="972" y="281">GitHub Actions</text><rect class="dg-node" x="706" y="238" width="200" height="84" rx="14"/><text class="dg-t" x="720" y="263">Rol OIDC</text><text class="dg-s" x="720" y="281">credenciales temporales</text><rect class="dg-node" x="430" y="224" width="230" height="112" rx="14"/><text class="dg-t" x="444" y="249">deploy.sh en la instancia</text><text class="dg-s" x="444" y="267">por SSM Run Command</text><text class="dg-s" x="444" y="285">baja el commit de main</text><text class="dg-s" x="444" y="303">rearma los contenedores</text><rect class="dg-node dg-node-acc" x="150" y="238" width="220" height="84" rx="14"/><text class="dg-t" x="164" y="263">App en línea</text><text class="dg-m" x="164" y="281">https://….cloudfront.net</text><text class="dg-s" x="164" y="299">migraciones al iniciar</text><polyline class="dg-edge dg-edge-dep" points="1058,144 1058,236" marker-end="url(#cic-ad)"/><rect class="dg-pill" x="915.6" y="166" width="264.8" height="20" rx="10"/><text class="dg-e dg-e-dep" x="1048" y="180" text-anchor="middle">si cambió backend, frontend o infra/ec2</text><polyline class="dg-edge dg-edge-dep" points="958,280 908,280" marker-end="url(#cic-ad)"/><polyline class="dg-edge dg-edge-dep" points="706,280 662,280" marker-end="url(#cic-ad)"/><polyline class="dg-edge dg-edge-dep" points="430,280 372,280" marker-end="url(#cic-ad)"/></svg>
