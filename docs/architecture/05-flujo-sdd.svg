<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1090 350" role="img" aria-label="Flujo de Spec-Driven Development: el equipo y la PO definen y validan, el agente de IA escribe spec, plan, tareas y código con Spec Kit, y todo vuelve al equipo por PR y revisión." width="1090" height="350"><style>svg { --d-bg: #fdf9ee; --d-surface: #ffffff; --d-zone: #f6eedd; --d-ink: #3b1f18; --d-muted: #6b4a40; --d-line: #dccdb2; --d-accent: #c23d17; --d-deploy: #2563c9; } @media (prefers-color-scheme: dark) { svg { --d-bg: #1d110d; --d-surface: #2a1914; --d-zone: #24150f; --d-ink: #fbeee0; --d-muted: #cdb5a6; --d-line: #5a3b30; --d-accent: #ff8d66; --d-deploy: #8fb8ff; } }
.dg { font-family: Nunito, 'Segoe UI', system-ui, sans-serif; }
.dg-bg { fill: var(--d-bg); }
.dg-zone { fill: var(--d-zone); stroke: var(--d-line); stroke-width: 1.5; stroke-dasharray: 6 5; }
.dg-band { fill: var(--d-zone); }
.dg-node { fill: var(--d-surface); stroke: var(--d-line); stroke-width: 1.5; }
.dg-node-acc { stroke: var(--d-accent); stroke-width: 2; }
.dg-node-ext { fill: var(--d-bg); stroke: var(--d-muted); stroke-dasharray: 4 3; }
.dg-node-ent { stroke: var(--d-ink); stroke-width: 1.5; }
.dg-rule { stroke: var(--d-line); stroke-width: 1.5; }
.dg-t { font-weight: 800; font-size: 13.5px; fill: var(--d-ink); }
.dg-s { font-weight: 600; font-size: 11.5px; fill: var(--d-muted); }
.dg-m { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 11px; fill: var(--d-muted); }
.dg-mono-t { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; font-size: 12px; fill: var(--d-ink); }
.dg-z { font-weight: 800; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; fill: var(--d-muted); }
.dg-e { font-weight: 700; font-size: 11px; fill: var(--d-ink); }
.dg-e-acc { fill: var(--d-accent); }
.dg-e-dep { fill: var(--d-deploy); }
.dg-pill { fill: var(--d-bg); }
.dg-edge { fill: none; stroke: var(--d-muted); stroke-width: 1.6; }
.dg-edge-acc { stroke: var(--d-accent); stroke-width: 2; }
.dg-edge-dep { stroke: var(--d-deploy); stroke-width: 1.8; stroke-dasharray: 7 4; }
.dg-edge-ret { stroke-dasharray: 5 4; }
.dg-life { stroke: var(--d-line); stroke-width: 1.5; stroke-dasharray: 3 5; }
.dg-mk { fill: var(--d-muted); }
.dg-mk-acc { fill: var(--d-accent); }
.dg-mk-dep { fill: var(--d-deploy); }
.dg-chip { fill: var(--d-zone); }
.dg-chip-acc { fill: var(--d-bg); stroke: var(--d-accent); stroke-width: 1.2; }
.dg-chip-t { font-weight: 800; font-size: 10px; letter-spacing: .05em; fill: var(--d-muted); }</style><rect class="dg-bg" width="1090" height="350"/><defs><marker id="sdd-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sdd-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk dg-mk-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="sdd-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk dg-mk-dep" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="dg-node" x="30" y="40" width="220" height="104" rx="14"/><text class="dg-t" x="44" y="65">Backlog</text><text class="dg-s" x="44" y="83">historias en la planilla</text><rect class="dg-chip" x="187.2" y="52" width="50.8" height="18" rx="9"/><text class="dg-chip-t" x="212.6" y="65" text-anchor="middle">EQUIPO</text><rect class="dg-node dg-node-acc" x="300" y="40" width="220" height="104" rx="14"/><text class="dg-t" x="314" y="65">spec.md</text><text class="dg-m" x="314" y="83">/speckit-specify</text><text class="dg-s" x="314" y="101">en español</text><rect class="dg-chip dg-chip-acc" x="439.8" y="52" width="68.2" height="18" rx="9"/><text class="dg-chip-t dg-e-acc" x="473.9" y="65" text-anchor="middle">AGENTE IA</text><rect class="dg-node" x="570" y="40" width="220" height="104" rx="14"/><text class="dg-t" x="584" y="65">Valida la PO</text><text class="dg-s" x="584" y="83">criterios y dudas</text><rect class="dg-chip" x="750.4" y="52" width="27.6" height="18" rx="9"/><text class="dg-chip-t" x="764.2" y="65" text-anchor="middle">PO</text><rect class="dg-node dg-node-acc" x="840" y="40" width="220" height="104" rx="14"/><text class="dg-t" x="854" y="65">Plan</text><text class="dg-m" x="854" y="83">/speckit-plan</text><text class="dg-s" x="854" y="101">constitución + mapa de tests</text><rect class="dg-chip dg-chip-acc" x="979.8" y="52" width="68.2" height="18" rx="9"/><text class="dg-chip-t dg-e-acc" x="1013.9" y="65" text-anchor="middle">AGENTE IA</text><rect class="dg-node dg-node-acc" x="840" y="216" width="220" height="104" rx="14"/><text class="dg-t" x="854" y="241">Tareas</text><text class="dg-m" x="854" y="259">/speckit-tasks</text><text class="dg-s" x="854" y="277">tests primero</text><rect class="dg-chip dg-chip-acc" x="979.8" y="228" width="68.2" height="18" rx="9"/><text class="dg-chip-t dg-e-acc" x="1013.9" y="241" text-anchor="middle">AGENTE IA</text><rect class="dg-node dg-node-acc" x="570" y="216" width="220" height="104" rx="14"/><text class="dg-t" x="584" y="241">Código y tests</text><text class="dg-m" x="584" y="259">/speckit-implement</text><text class="dg-m" x="584" y="277">/speckit-converge</text><rect class="dg-chip dg-chip-acc" x="709.8" y="228" width="68.2" height="18" rx="9"/><text class="dg-chip-t dg-e-acc" x="743.9" y="241" text-anchor="middle">AGENTE IA</text><rect class="dg-node" x="300" y="216" width="220" height="104" rx="14"/><text class="dg-t" x="314" y="241">PR, CI y revisión</text><text class="dg-s" x="314" y="259">uso de IA declarado</text><text class="dg-s" x="314" y="277">otro integrante revisa</text><rect class="dg-chip" x="457.2" y="228" width="50.8" height="18" rx="9"/><text class="dg-chip-t" x="482.6" y="241" text-anchor="middle">EQUIPO</text><rect class="dg-node" x="30" y="216" width="220" height="104" rx="14"/><text class="dg-t" x="44" y="241">Demo a la PO</text><text class="dg-s" x="44" y="259">review del miércoles</text><rect class="dg-chip" x="158.2" y="228" width="79.8" height="18" rx="9"/><text class="dg-chip-t" x="198.1" y="241" text-anchor="middle">EQUIPO + PO</text><polyline class="dg-edge" points="250,92 298,92" marker-end="url(#sdd-a)"/><polyline class="dg-edge" points="520,92 568,92" marker-end="url(#sdd-a)"/><polyline class="dg-edge" points="790,92 838,92" marker-end="url(#sdd-a)"/><polyline class="dg-edge" points="950,144 950,214" marker-end="url(#sdd-a)"/><polyline class="dg-edge" points="840,268 792,268" marker-end="url(#sdd-a)"/><polyline class="dg-edge" points="570,268 522,268" marker-end="url(#sdd-a)"/><polyline class="dg-edge" points="300,268 252,268" marker-end="url(#sdd-a)"/><text class="dg-s" x="30" y="342">Si algo cambia el comportamiento, primero se actualiza la spec y la vuelve a validar la PO.</text></svg>
