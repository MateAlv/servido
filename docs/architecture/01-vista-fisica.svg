<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1260 680" role="img" aria-label="Vista física: los usuarios entran solo por CloudFront, que manda todo a una instancia EC2 donde Docker Compose corre la web, la API y PostgreSQL; los datos viven en un volumen aparte con snapshots cada noche y GitHub despliega con un rol OIDC." width="1260" height="680"><style>svg { --d-bg: #fdf9ee; --d-surface: #ffffff; --d-zone: #f6eedd; --d-ink: #3b1f18; --d-muted: #6b4a40; --d-line: #dccdb2; --d-accent: #c23d17; --d-deploy: #2563c9; } @media (prefers-color-scheme: dark) { svg { --d-bg: #1d110d; --d-surface: #2a1914; --d-zone: #24150f; --d-ink: #fbeee0; --d-muted: #cdb5a6; --d-line: #5a3b30; --d-accent: #ff8d66; --d-deploy: #8fb8ff; } }
.dg { font-family: Nunito, 'Segoe UI', system-ui, sans-serif; }
.dg-bg { fill: var(--d-bg); }
.dg-zone { fill: var(--d-zone); stroke: var(--d-line); stroke-width: 1.5; stroke-dasharray: 6 5; }
.dg-band { fill: var(--d-zone); }
.dg-node { fill: var(--d-surface); stroke: var(--d-line); stroke-width: 1.5; }
.dg-node-acc { stroke: var(--d-accent); stroke-width: 2; }
.dg-node-ext { fill: var(--d-bg); stroke: var(--d-muted); stroke-dasharray: 4 3; }
.dg-node-ent { stroke: var(--d-ink); stroke-width: 1.5; }
.dg-rule { stroke: var(--d-line); stroke-width: 1.5; }
.dg-t { font-weight: 800; font-size: 13.5px; fill: var(--d-ink); }
.dg-s { font-weight: 600; font-size: 11.5px; fill: var(--d-muted); }
.dg-m { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 11px; fill: var(--d-muted); }
.dg-mono-t { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; font-size: 12px; fill: var(--d-ink); }
.dg-z { font-weight: 800; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; fill: var(--d-muted); }
.dg-e { font-weight: 700; font-size: 11px; fill: var(--d-ink); }
.dg-e-acc { fill: var(--d-accent); }
.dg-e-dep { fill: var(--d-deploy); }
.dg-pill { fill: var(--d-bg); }
.dg-edge { fill: none; stroke: var(--d-muted); stroke-width: 1.6; }
.dg-edge-acc { stroke: var(--d-accent); stroke-width: 2; }
.dg-edge-dep { stroke: var(--d-deploy); stroke-width: 1.8; stroke-dasharray: 7 4; }
.dg-edge-ret { stroke-dasharray: 5 4; }
.dg-life { stroke: var(--d-line); stroke-width: 1.5; stroke-dasharray: 3 5; }
.dg-mk { fill: var(--d-muted); }
.dg-mk-acc { fill: var(--d-accent); }
.dg-mk-dep { fill: var(--d-deploy); }
.dg-chip { fill: var(--d-zone); }
.dg-chip-acc { fill: var(--d-bg); stroke: var(--d-accent); stroke-width: 1.2; }
.dg-chip-t { font-weight: 800; font-size: 10px; letter-spacing: .05em; fill: var(--d-muted); }</style><rect class="dg-bg" width="1260" height="680"/><defs><marker id="fis-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="fis-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk dg-mk-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="fis-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk dg-mk-dep" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="dg-zone" x="252" y="20" width="984" height="640" rx="18"/><text class="dg-z" x="268" y="44">AWS · us-east-1 · Free plan</text><rect class="dg-zone" x="520" y="100" width="700" height="220" rx="18"/><text class="dg-z" x="536" y="124">EC2 t4g.small · Docker Compose · solo acepta a CloudFront</text><rect class="dg-node dg-node-ext" x="24" y="40" width="190" height="70" rx="14"/><text class="dg-t" x="38" y="65">OpenStreetMap</text><text class="dg-s" x="38" y="83">mapas y direcciones</text><rect class="dg-node dg-node-ext" x="24" y="150" width="190" height="64" rx="14"/><text class="dg-t" x="38" y="175">Comensal</text><text class="dg-s" x="38" y="193">celular o navegador</text><rect class="dg-node dg-node-ext" x="24" y="232" width="190" height="64" rx="14"/><text class="dg-t" x="38" y="257">Restaurante</text><text class="dg-s" x="38" y="275">navegador</text><rect class="dg-node dg-node-ext" x="24" y="400" width="190" height="84" rx="14"/><text class="dg-t" x="38" y="425">GitHub</text><text class="dg-s" x="38" y="443">repo público</text><text class="dg-s" x="38" y="461">Actions: CI y deploy</text><rect class="dg-node dg-node-ext" x="24" y="560" width="190" height="70" rx="14"/><text class="dg-t" x="38" y="585">Equipo (6 personas)</text><text class="dg-s" x="38" y="603">docker compose local</text><rect class="dg-node dg-node-acc" x="282" y="150" width="180" height="146" rx="14"/><text class="dg-t" x="296" y="175">CloudFront</text><text class="dg-s" x="296" y="193">HTTPS · *.cloudfront.net</text><text class="dg-s" x="296" y="211">cachea solo /assets</text><text class="dg-m" x="296" y="229">≈ USD 0 · free tier</text><rect class="dg-node dg-node-acc" x="540" y="150" width="180" height="120" rx="14"/><text class="dg-t" x="554" y="175">web · nginx</text><text class="dg-s" x="554" y="193">la app de React</text><text class="dg-s" x="554" y="211">manda /api a la API</text><rect class="dg-node dg-node-acc" x="780" y="150" width="180" height="120" rx="14"/><text class="dg-t" x="794" y="175">api · FastAPI</text><text class="dg-s" x="794" y="193">Python 3.12</text><text class="dg-s" x="794" y="211">migra la base al iniciar</text><rect class="dg-node dg-node-acc" x="1020" y="150" width="180" height="120" rx="14"/><text class="dg-t" x="1034" y="175">db · PostgreSQL 17</text><text class="dg-s" x="1034" y="193">igual que en local</text><text class="dg-s" x="1034" y="211">sin puertos abiertos</text><rect class="dg-node" x="540" y="400" width="180" height="84" rx="14"/><text class="dg-t" x="554" y="425">IAM · rol de deploy</text><text class="dg-s" x="554" y="443">OIDC, sin claves</text><text class="dg-s" x="554" y="461">solo la rama main</text><rect class="dg-node" x="780" y="400" width="180" height="84" rx="14"/><text class="dg-t" x="794" y="425">SSM Parameter Store</text><text class="dg-s" x="794" y="443">contraseña de la base</text><text class="dg-s" x="794" y="461">y clave JWT · cifradas</text><rect class="dg-node" x="1020" y="400" width="180" height="84" rx="14"/><text class="dg-t" x="1034" y="425">EBS · datos</text><text class="dg-s" x="1034" y="443">8 GB · cifrado</text><text class="dg-s" x="1034" y="461">sobrevive al reemplazo</text><rect class="dg-node" x="1020" y="540" width="180" height="84" rx="14"/><text class="dg-t" x="1034" y="565">Snapshots</text><text class="dg-s" x="1034" y="583">Data Lifecycle Manager</text><text class="dg-s" x="1034" y="601">se guardan los últimos 7</text><rect class="dg-node" x="282" y="540" width="180" height="84" rx="14"/><text class="dg-t" x="296" y="565">AWS Budgets</text><text class="dg-s" x="296" y="583">alerta USD 15/mes</text><text class="dg-s" x="296" y="601">por email al equipo</text><polyline class="dg-edge dg-edge-acc" points="214,182 280,182" marker-end="url(#fis-aa)"/><rect class="dg-pill" x="223.1" y="172" width="47.9" height="20" rx="10"/><text class="dg-e dg-e-acc" x="247" y="186" text-anchor="middle">HTTPS</text><polyline class="dg-edge dg-edge-acc" points="214,264 280,264" marker-end="url(#fis-aa)"/><rect class="dg-pill" x="223.1" y="254" width="47.9" height="20" rx="10"/><text class="dg-e dg-e-acc" x="247" y="268" text-anchor="middle">HTTPS</text><polyline class="dg-edge dg-edge-ret" points="119,150 119,112" marker-end="url(#fis-a)"/><rect class="dg-pill" x="98.2" y="121" width="41.5" height="20" rx="10"/><text class="dg-e" x="119" y="135" text-anchor="middle">mapa</text><polyline class="dg-edge dg-edge-acc" points="462,210 538,210" marker-end="url(#fis-aa)"/><rect class="dg-pill" x="466.5" y="180" width="67.0" height="20" rx="10"/><text class="dg-e dg-e-acc" x="500" y="194" text-anchor="middle">HTTP :80</text><polyline class="dg-edge dg-edge-acc" points="720,210 778,210" marker-end="url(#fis-aa)"/><rect class="dg-pill" x="721.9" y="180" width="54.3" height="20" rx="10"/><text class="dg-e dg-e-acc" x="749" y="194" text-anchor="middle">/api/*</text><polyline class="dg-edge dg-edge-acc" points="960,210 1018,210" marker-end="url(#fis-aa)"/><rect class="dg-pill" x="971.4" y="180" width="35.1" height="20" rx="10"/><text class="dg-e dg-e-acc" x="989" y="194" text-anchor="middle">SQL</text><polyline class="dg-edge" points="1110,270 1110,398" marker-end="url(#fis-a)"/><rect class="dg-pill" x="1051.0" y="350" width="118.1" height="20" rx="10"/><text class="dg-e" x="1110" y="364" text-anchor="middle">guarda los datos</text><polyline class="dg-edge" points="1110,484 1110,538" marker-end="url(#fis-a)"/><rect class="dg-pill" x="1070.1" y="501" width="79.8" height="20" rx="10"/><text class="dg-e" x="1110" y="515" text-anchor="middle">cada noche</text><polyline class="dg-edge" points="870,322 870,398" marker-end="url(#fis-a)"/><rect class="dg-pill" x="811.0" y="350" width="118.1" height="20" rx="10"/><text class="dg-e" x="870" y="364" text-anchor="middle">lee los secretos</text><polyline class="dg-edge dg-edge-dep" points="214,442 538,442" marker-end="url(#fis-ad)"/><rect class="dg-pill" x="307.4" y="432" width="137.2" height="20" rx="10"/><text class="dg-e dg-e-dep" x="376" y="446" text-anchor="middle">asume el rol (OIDC)</text><polyline class="dg-edge dg-edge-dep" points="630,400 630,322" marker-end="url(#fis-ad)"/><rect class="dg-pill" x="567.8" y="350" width="124.5" height="20" rx="10"/><text class="dg-e dg-e-dep" x="630" y="364" text-anchor="middle">deploy.sh por SSM</text><polyline class="dg-edge" points="119,560 119,486" marker-end="url(#fis-a)"/><rect class="dg-pill" x="82.3" y="513" width="73.4" height="20" rx="10"/><text class="dg-e" x="119" y="527" text-anchor="middle">push · PR</text></svg>
