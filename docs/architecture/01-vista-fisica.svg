<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1200 670" role="img" aria-label="Vista física: los usuarios entran solo por CloudFront, que sirve la app desde S3 y manda /api a una instancia EC2; la base RDS es privada y GitHub despliega con un rol OIDC." width="1200" height="670"><style>svg { --d-bg: #fdf9ee; --d-surface: #ffffff; --d-zone: #f6eedd; --d-ink: #3b1f18; --d-muted: #6b4a40; --d-line: #dccdb2; --d-accent: #c23d17; --d-deploy: #2563c9; } @media (prefers-color-scheme: dark) { svg { --d-bg: #1d110d; --d-surface: #2a1914; --d-zone: #24150f; --d-ink: #fbeee0; --d-muted: #cdb5a6; --d-line: #5a3b30; --d-accent: #ff8d66; --d-deploy: #8fb8ff; } }
.dg { font-family: Nunito, 'Segoe UI', system-ui, sans-serif; }
