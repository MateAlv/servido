-s" x="634" y="367">tiempo de preparación</text><text class="dg-s" x="634" y="385">restricciones</text><text class="dg-s" x="634" y="403">disponible</text><rect class="dg-node dg-node-ent" x="240" y="480" width="200" height="104" rx="14"/><text class="dg-t" x="254" y="505">Pago</text><line class="dg-rule" x1="240" y1="516" x2="440" y2="516"/><text class="dg-s" x="254" y="529">efectivo o electrónico</text><text class="dg-s" x="254" y="547">pagado / pendiente</text><text class="dg-s" x="254" y="565">seña</text><rect class="dg-node dg-node-ent" x="560" y="480" width="200" height="86" rx="14"/><text class="dg-t" x="574" y="505">Ítem de pedido</text><line class="dg-rule" x1="560" y1="516" x2="760" y2="516"/><text class="dg-s" x="574" y="529">cantidad</text><text class="dg-s" x="574" y="547">precio pactado</text><polyline class="dg-edge" points="240,90 328,90" marker-end="url(#dom-a)"/><rect class="dg-pill" x="244.1" y="62" width="79.8" height="20" rx="10"/><text class="dg-e" x="284" y="76" text-anchor="middle">hace · 1:N</text><polyline class="dg-edge" points="530,90 618,90" marker-end="url(#dom-a)"/><rect class="dg-pill" x="540.5" y="62" width="67.0" height="20" rx="10"/><text class="dg-e" x="574" y="76" text-anchor="middle">en · N:1</text><polyline class="dg-edge" points="140,126 140,298" marker-end="url(#dom-a)"/><rect class="dg-pill" x="90.5" y="202" width="98.9" height="20" rx="10"/><text class="dg-e" x="140" y="216" text-anchor="middle">escribe · 1:N</text><polyline class="dg-edge" points="240,340 285,340 285,140 328,140" marker-end="url(#dom-a)"/><rect class="dg-pill" x="241.9" y="230" width="86.2" height="20" rx="10"/><text class="dg-e" x="285" y="244" text-anchor="middle">sobre · 1:1</text><polyline class="dg-edge" points="430,162 430,298" marker-end="url(#dom-a)"/><rect class="dg-pill" x="358.2" y="222" width="143.6" height="20" rx="10"/><text class="dg-e" x="430" y="236" text-anchor="middle">puede tener · 1:0..1</text><polyline class="dg-edge" points="380,386 