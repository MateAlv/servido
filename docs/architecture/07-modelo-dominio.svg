<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1160 610" role="img" aria-label="Modelo de dominio conceptual: un comensal hace reservas en un restaurante; una reserva puede tener un pedido con ítems de platos y un pago; el restaurante define turnos, mesas, bloqueos, platos y promociones; las reseñas son sobre reservas realizadas." width="1160" height="610"><style>svg { --d-bg: #fdf9ee; --d-surface: #ffffff; --d-zone: #f6eedd; --d-ink: #3b1f18; --d-muted: #6b4a40; --d-line: #dccdb2; --d-accent: #c23d17; --d-deploy: #2563c9; } @media (prefers-color-scheme: dark) { svg { --d-bg: #1d110d; --d-surface: #2a1914; --d-zone: #24150f; --d-ink: #fbeee0; --d-muted: #cdb5a6; --d-line: #5a3b30; --d-accent: #ff8d66; --d-deploy: #8fb8ff; } }
.dg { font-family: Nunito, 'Segoe UI', system-ui, sans-serif; }
.dg-bg { fill: var(--d-bg); }
.dg-zone { fill: var(--d-zone); stroke: var(--d-line); stroke-width: 1.5; stroke-dasharray: 6 5; }
.dg-band { fill: var(--d-zone); }
.dg-node { fill: var(--d-surface); stroke: var(--d-line); stroke-width: 1.5; }
.dg-node-acc { stroke: var(--d-accent); stroke-width: 2; }
.dg-node-ext { fill: var(--d-bg); stroke: var(--d-muted); stroke-dasharray: 4 3; }
.dg-node-ent { stroke: var(--d-ink); stroke-width: 1.5; }
.dg-rule { stroke: var(--d-line); stroke-width: 1.5; }
.dg-t { font-weight: 800; font-size: 13.5px; fill: var(--d-ink); }
.dg-s { font-weight: 600; font-size: 11.5px; fill: var(--d-muted); }
.dg-m { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500; font-size: 11px; fill: var(--d-muted); }
.dg-mono-t { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 700; font-size: 12px; fill: var(--d-ink); }
.dg-z { font-weight: 800; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; fill: var(--d-muted); }
.dg-e { font-weight: 700; font-size: 11px; fill: var(--d-ink); }
.dg-e-acc { fill: var(--d-accent); }
.dg-e-dep { fill: var(--d-deploy); }
.dg-pill { fill: var(--d-bg); }
.dg-edge { fill: none; stroke: var(--d-muted); stroke-width: 1.6; }
.dg-edge-acc { stroke: var(--d-accent); stroke-width: 2; }
.dg-edge-dep { stroke: var(--d-deploy); stroke-width: 1.8; stroke-dasharray: 7 4; }
.dg-edge-ret { stroke-dasharray: 5 4; }
.dg-life { stroke: var(--d-line); stroke-width: 1.5; stroke-dasharray: 3 5; }
.dg-mk { fill: var(--d-muted); }
.dg-mk-acc { fill: var(--d-accent); }
.dg-mk-dep { fill: var(--d-deploy); }
.dg-chip { fill: var(--d-zone); }
.dg-chip-acc { fill: var(--d-bg); stroke: var(--d-accent); stroke-width: 1.2; }
.dg-chip-t { font-weight: 800; font-size: 10px; letter-spacing: .05em; fill: var(--d-muted); }</style><rect class="dg-bg" width="1160" height="610"/><defs><marker id="dom-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dom-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk dg-mk-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="dom-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk dg-mk-dep" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="dg-node dg-node-ent" x="40" y="40" width="200" height="86" rx="14"/><text class="dg-t" x="54" y="65">Comensal</text><line class="dg-rule" x1="40" y1="76" x2="240" y2="76"/><text class="dg-s" x="54" y="89">email (usuario)</text><text class="dg-s" x="54" y="107">contraseña (hash)</text><rect class="dg-node dg-node-ent" x="330" y="40" width="200" height="122" rx="14"/><text class="dg-t" x="344" y="65">Reserva</text><line class="dg-rule" x1="330" y1="76" x2="530" y2="76"/><text class="dg-s" x="344" y="89">fecha y hora</text><text class="dg-s" x="344" y="107">personas</text><text class="dg-s" x="344" y="125">mesa y tipo</text><text class="dg-s" x="344" y="143">estado</text><rect class="dg-node dg-node-ent" x="620" y="40" width="200" height="122" rx="14"/><text class="dg-t" x="634" y="65">Restaurante</text><line class="dg-rule" x1="620" y1="76" x2="820" y2="76"/><text class="dg-s" x="634" y="89">nombre, CUIT, teléfono</text><text class="dg-s" x="634" y="107">ubicación</text><text class="dg-s" x="634" y="125">nivel de precio</text><text class="dg-s" x="634" y="143">restricciones</text><rect class="dg-node dg-node-ent" x="930" y="20" width="200" height="86" rx="14"/><text class="dg-t" x="944" y="45">Turno</text><line class="dg-rule" x1="930" y1="56" x2="1130" y2="56"/><text cla